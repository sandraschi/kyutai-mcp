[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "kyutai-mcp"
version = "0.2.0"
description = "FastMCP 3.1.0 server + SOTA webapp for Kyutai Moshi research and ops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=3.4.4,<4",
  "pydantic>=2.8.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "nvidia-ml-py>=12.560.30; platform_system == 'Windows' or platform_system == 'Linux'",
  "aiohttp>=3.10.5,<3.12",
  "moshi>=0.2.13",
  "torch>=2.5.0",
]

[project.scripts]
kyutai-mcp = "kyutai_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.16.0,<0.17",
  "ty>=0.0.1",
]
pocket-tts = [
  "pocket-tts>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kyutai_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S106", "S110", "S112", "S101", "B008", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
